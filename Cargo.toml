[package]
name = "veilroom"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Ephemeral, host-controlled private group chat that operates over temporary Tor onion services"
authors = []
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["tor", "chat", "ephemeral", "encryption"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
argon2 = { version = "0.5.3", features = ["std"], registry = "crates-io-sparse" }
base64 = { version = "0.23", registry = "crates-io-sparse" }
chacha20poly1305 = { version = "0.11.0", registry = "crates-io-sparse" }
crossterm = { version = "0.29.0", registry = "crates-io-sparse" }
ed25519-dalek = { version = "3.0.0", features = ["zeroize"], registry = "crates-io-sparse" }
getrandom = { version = "0.4.3", registry = "crates-io-sparse" }
hkdf = { version = "0.13.0", registry = "crates-io-sparse" }
hmac = { version = "0.13.0", registry = "crates-io-sparse" }
minicbor = { version = "2.3.0", features = ["std"], registry = "crates-io-sparse" }
ratatui = { version = "0.30.2", registry = "crates-io-sparse" }
sha2 = { version = "0.11.0", registry = "crates-io-sparse" }
sha3 = { version = "0.11", registry = "crates-io-sparse" }
subtle = { version = "2.6.1", registry = "crates-io-sparse" }
thiserror = { version = "2.0.19", registry = "crates-io-sparse" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "net", "io-util", "time", "fs", "sync"], registry = "crates-io-sparse" }
unicode-normalization = { version = "0.1.25", registry = "crates-io-sparse" }
unicode-width = { version = "0.2.2", registry = "crates-io-sparse" }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"], registry = "crates-io-sparse" }
zeroize = { version = "1.9.0", registry = "crates-io-sparse" }

[dev-dependencies]
proptest = { version = "1.11.0", registry = "crates-io-sparse" }

[lints.rust]
unsafe_code = "forbid"

# ---------------------------------------------------------------------------
# Packaging (Stage 9): .deb via cargo-deb, .rpm via cargo-generate-rpm.
# The packages depend on the tor package and never install services,
# daemons, config directories, or application users.
# ---------------------------------------------------------------------------

[package.metadata.deb]
maintainer = "Veilroom contributors <deniztopcuoglu-iletisim@pm.me>"
copyright = "2026 Veilroom contributors"
license-file = ["LICENSE", "0"]
depends = "tor"
section = "net"
priority = "optional"
extended-description = """\
Ephemeral, host-controlled private group chat that operates over temporary \
Tor onion services. The host launches an ephemeral onion service and shares \
a one-time invitation URI; participants join through their own Tor \
subprocesses. The package does not install a service or daemon; the \
application launches its own Tor subprocess per session."""

[[package.metadata.deb.assets]]
source = "target/release/veilroom"
dest = "/usr/bin/veilroom"
mode = "755"

[[package.metadata.deb.assets]]
source = "README.md"
dest = "/usr/share/doc/veilroom/README.md"
mode = "644"

[[package.metadata.deb.assets]]
source = "docs/protocol-v1.md"
dest = "/usr/share/doc/veilroom/protocol-v1.md"
mode = "644"

[[package.metadata.deb.assets]]
source = "docs/test-vectors.md"
dest = "/usr/share/doc/veilroom/test-vectors.md"
mode = "644"

[[package.metadata.deb.assets]]
source = "LICENSE"
dest = "/usr/share/licenses/veilroom/LICENSE"
mode = "644"

[package.metadata.generate-rpm]
package-name = "veilroom"

[[package.metadata.generate-rpm.assets]]
source = "target/release/veilroom"
dest = "/usr/bin/veilroom"
mode = "755"
summary = "Ephemeral, host-controlled private group chat over Tor"
license = "GPL-3.0-or-later"
description = """\
Ephemeral, host-controlled private group chat that operates over temporary \
Tor onion services. The host launches an ephemeral onion service and shares \
a one-time invitation URI; participants join through their own Tor \
subprocesses. The package does not install a service or daemon; the \
application launches its own Tor subprocess per session."""

[package.metadata.generate-rpm.requires]
tor = ""

[[package.metadata.generate-rpm.assets]]
source = "README.md"
dest = "/usr/share/doc/veilroom/README.md"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "docs/protocol-v1.md"
dest = "/usr/share/doc/veilroom/protocol-v1.md"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "docs/test-vectors.md"
dest = "/usr/share/doc/veilroom/test-vectors.md"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "LICENSE"
dest = "/usr/share/licenses/veilroom/LICENSE"
mode = "644"
